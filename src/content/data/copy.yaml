# Page copy for the small pages that aren't pieces or collections of their
# own: the flags scoreboard, the 404 page, the /wp-admin/ honeypot, and the
# page robots.txt points at.

- id: flags
  title: "Capture the flags"
  lead: >
    Six flags are hidden around this site, each shaped like Q{...}. Paste
    one below to check it. Hints unlock as you find more.
  paragraphs:
    - >
      Reading this site's public source on GitHub is a completely
      legitimate technique; real researchers read source too. The flags are
      sitting in a data file there. Finding them live is more fun, but a
      flag is a flag.
    - >
      Checking happens entirely in your browser: each guess is hashed with
      SHA-256 and compared against the six hashes on this page. Nothing is
      sent anywhere, and your progress is kept only in this browser's local
      storage.

- id: not-found
  title: "Case file not found"
  lead: "There is no page at this address. It may have moved, or it never existed."
  paragraphs:
    - "The rest of the file is redacted, but you are cleared to open it."

- id: honeypot
  title: "There is no WordPress here"
  lead: >
    You found /wp-admin/, the path every scanner on the internet tries
    first. This site is plain static files: no admin panel, no database, no
    login, and nothing on this page records that you came by.
  paragraphs:
    - "Curiosity deserves a reward, though."

- id: field-notes
  title: "Field notes"
  lead: >
    robots.txt asked crawlers not to come here. A Disallow line is a
    request, not a lock, and it tells humans exactly where to look.
  paragraphs:
    - "Which is why nothing secret should ever be listed there."

- id: whoami
  title: "You are the traffic"
  lead: >
    Every page you load hands the server a small description of your
    browser. Press the button to see the part this page can read, laid out
    the way an analyst would see a flow record.
  paragraphs:
    - >
      When you press it, this page reads your user agent and UA client
      hints, languages, time zone, screen size and pixel ratio, color
      scheme, CPU thread count, a hash of how your browser draws a small
      test image (canvas), and which of 28 common fonts are installed.
      Nothing is read before you press it.
    - >
      All of it stays in this tab. Nothing is sent anywhere and nothing is
      stored, and it is wiped when you leave. You can check: after the page
      has loaded, your browser's developer tools show no further network
      requests and nothing written to storage, even after you press the
      button.

- id: whoami-tips
  title: "How to reduce this"
  lead: >
    You can't disappear from fingerprinting entirely. The practical goal is
    to look like as many other people as possible.
  paragraphs:
    - >
      Use a browser with fingerprinting protection switched on: Firefox
      with Enhanced Tracking Protection set to Strict, Brave, or Mullvad
      Browser. For the strongest protection, Tor Browser makes its users
      look alike on purpose.
    - >
      Prefer common settings over clever ones. A rare mix of extensions,
      languages or tweaks can make you stand out more, not less.
    - >
      Keep your browser updated. Old versions get rarer, and rarer is more
      identifying.
    - >
      Think twice before installing unusual fonts system-wide; each one is
      another signal.
    - >
      Private windows clear cookies, not your fingerprint. They help against
      being linked over time, not against being recognized.
  link:
    label: "Test your browser properly with EFF's Cover Your Tracks"
    url: "https://coveryourtracks.eff.org/"

